# =========================================================================
# DOCKER COMPOSE - SISTEMA GALINDO EN VPS
# Incluye: PostgreSQL, Supabase Studio, Kong API Gateway, Next.js Web App
# =========================================================================

version: '3.8'

services:
  # 1. Base de datos PostgreSQL
  db:
    image: supabase/postgres:15.1.1.78
    container_name: galindo-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-galindo_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - galindo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d galindo_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Supabase Studio (Panel visual web para administrar la BD)
  studio:
    image: supabase/studio:20240101-8e0108c
    container_name: galindo-studio
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DEFAULT_ORGANIZATION_NAME: "Escuela de Barberia Galindo"
      DEFAULT_PROJECT_NAME: "Galindo Ica"
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: ${PUBLIC_SUPABASE_URL:-http://localhost:8000}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
    networks:
      - galindo-network
    depends_on:
      - db

  # 3. Postgres-Meta (Microservicio auxiliar para Studio)
  meta:
    image: supabase/postgres-meta:v0.75.0
    container_name: galindo-meta
    restart: unless-stopped
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: ${POSTGRES_DB:-galindo_db}
      PG_META_DB_USER: ${POSTGRES_USER:-postgres}
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - galindo-network
    depends_on:
      - db

  # 4. PostgREST (Genera API REST automática instantánea desde PostgreSQL)
  rest:
    image: postgrest/postgrest:v12.0.1
    container_name: galindo-rest
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      PGRST_DB_URI: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-galindo_db}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
    networks:
      - galindo-network
    depends_on:
      - db

  # 5. Aplicación Principal Next.js (E-commerce + Panel Admin Galindo)
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: galindo-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://galindobarber.pe}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-galindo_db}
      NEXT_PUBLIC_SUPABASE_URL: ${PUBLIC_SUPABASE_URL:-http://localhost:8000}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
    networks:
      - galindo-network
    depends_on:
      - db

networks:
  galindo-network:
    driver: bridge

volumes:
  db-data:
    driver: local
