# =========================================================================
# CONFIGURACIÓN DE NGINX PARA EL VPS - SISTEMA GALINDO (ICA)
# =========================================================================

server {
    listen 80;
    server_name galindobarber.pe www.galindobarber.pe;

    # Redirección automática a HTTPS (descomentar una vez instalado Certbot SSL)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Acceso al Panel de Base de Datos (Supabase Studio) protegido por IP o subdominio
    location /studio/ {
        proxy_pass http://localhost:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
